<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gestion des licences</title>
<style>
  :root {
    --bg: #101417;
    --card: #1a1e22;
    --card-border: #2a2f34;
    --text: #e8ecef;
    --muted: #9aa4ab;
    --accent: #ff7a3d;
    --accent-dark: #cc5a24;
    --success: #4cd98a;
    --error: #ff5c5c;
    --input-bg: #0d1012;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 16px;
  }
  h1 { font-size: 20px; margin: 0 0 4px; }
  h2 { font-size: 15px; margin: 0 0 12px; color: var(--accent); }
  .sub { color: var(--muted); font-size: 13px; margin-bottom: 20px; }
  .card {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 16px;
    max-width: 900px;
  }
  label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; margin-top: 10px; }
  input, select {
    width: 100%;
    background: var(--input-bg);
    border: 1px solid var(--card-border);
    border-radius: 8px;
    padding: 10px;
    color: var(--text);
    font-size: 14px;
  }
  .row { display: flex; gap: 10px; flex-wrap: wrap; }
  .row > div { flex: 1; min-width: 140px; }
  button {
    background: var(--accent);
    color: #2a0e00;
    border: none;
    border-radius: 8px;
    padding: 10px 16px;
    font-weight: bold;
    font-size: 14px;
    cursor: pointer;
    margin-top: 14px;
  }
  button:hover { background: var(--accent-dark); color: #fff; }
  button.secondary {
    background: transparent;
    border: 1px solid var(--card-border);
    color: var(--text);
  }
  button.small { padding: 6px 10px; font-size: 12px; margin-top: 0; }
  .msg { margin-top: 10px; font-size: 13px; }
  .msg.ok { color: var(--success); }
  .msg.err { color: var(--error); }
  table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 10px; }
  th, td { text-align: left; padding: 8px; border-bottom: 1px solid var(--card-border); }
  th { color: var(--muted); font-weight: normal; }
  .badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: bold;
  }
  .badge.unused { background: #2a2f34; color: var(--muted); }
  .badge.active { background: rgba(76,217,138,0.15); color: var(--success); }
  .badge.revoked { background: rgba(255,92,92,0.15); color: var(--error); }
  .keys-list { font-family: monospace; font-size: 12px; white-space: pre-wrap; background: var(--input-bg); border-radius: 8px; padding: 10px; margin-top: 10px; }
  .actions { display: flex; gap: 6px; flex-wrap: wrap; }
  .filters { display: flex; gap: 10px; align-items: flex-end; margin-bottom: 4px; }
  .filters > div { flex: 1; }
  .filters button { margin-top: 0; }
  .lock-screen { max-width: 400px; margin: 60px auto; }
</style>
</head>
<body>

<div id="lockScreen" class="lock-screen card" style="display:none;">
  <h1>Connexion admin</h1>
  <div class="sub">Entre le secret admin (celui configuré dans Render en variable ADMIN_SECRET).</div>
  <label>Secret admin</label>
  <input type="password" id="secretInput" placeholder="••••••••">
  <button onclick="saveSecret()">Se connecter</button>
  <div id="lockMsg" class="msg"></div>
</div>

<div id="app" style="display:none;">
  <h1>Gestion des licences</h1>
  <div class="sub">Génère, consulte et révoque les clés — <a href="#" onclick="logout();return false;" style="color:var(--muted);">se déconnecter</a></div>

        <input id="genAppId" list="appIdList" value="com.barreamisgreg">
      </div>
      <div>
        <label>Nombre de clés</label>
        <input id="genCount" type="number" value="1" min="1" max="1000">
      </div>
      <div>
        <label>Durée (jours, 0 = illimité)</label>
        <input id="genDur
